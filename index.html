<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#131512" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#1f2f26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f7f5f0">
<title>Finance</title>
<style>
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface-2:#ede9e1;
  --text:#16181d;
  --text-2:#4a4f5c;
  --muted:#8f939e;
  --line:#e5e1d8;
  --line-2:#d4cfc2;
  --accent:#1f2f26;
  --income:#4a6b52;
  --expense:#a1553d;
  --shadow-sm:0 1px 2px rgba(22,24,29,.04),0 2px 8px rgba(22,24,29,.03);
  --shadow:0 1px 2px rgba(22,24,29,.04),0 12px 40px rgba(22,24,29,.06);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;font-weight:400}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select{font:inherit;border:0;background:transparent;color:inherit;outline:none}
.hidden{display:none!important}

header{display:flex;align-items:center;justify-content:center;
  padding:12px 18px;
  background:rgba(247,245,240,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;
  font-family:var(--serif);font-size:16px;font-weight:500}
.brand-icon{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  background:var(--accent);color:#fff;font-size:12px;font-weight:600;
  font-family:-apple-system,system-ui,sans-serif}

.view{padding:16px 18px 24px;max-width:720px;margin:0 auto}
.view-head{margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px}
.view-head h2{margin:0;font-size:22px;font-weight:400;
  font-family:var(--serif);letter-spacing:-.02em}

/* ===== HOME ===== */
.home-view{min-height:calc(100vh - 60px);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 20px;gap:24px}
.home-center{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:28px;width:100%}
.home-balance{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 20px;border-radius:16px;transition:background .2s;cursor:pointer;background:none;border:0}
.home-balance:hover{background:rgba(255,255,255,.5)}
.home-balance-label{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.16em;font-weight:600}
.home-balance-value{font-family:var(--serif);font-size:clamp(38px,9vw,50px);
  font-weight:400;letter-spacing:-.03em;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1.1}
.actions{display:grid;grid-template-columns:1fr;gap:10px;
  width:100%;max-width:400px}
.action{padding:18px 22px;border-radius:14px;background:var(--surface);color:var(--text);
  font-size:18px;font-weight:400;text-align:left;
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--serif);letter-spacing:-.01em;
  box-shadow:var(--shadow-sm);transition:all .2s;border:1px solid var(--line)}
.action:active{transform:scale(.98);background:var(--bg)}
.action .arrow{font-size:20px;color:var(--muted);font-family:-apple-system,system-ui,sans-serif;
  font-weight:300;line-height:1}
.action.income .arrow{color:var(--income)}
.action.expense .arrow{color:var(--expense)}

/* ===== Быстрая навигация ===== */
.quick-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  width:100%;max-width:400px;margin-top:auto}
.quick-nav-btn{aspect-ratio:1;display:grid;place-items:center;
  font-size:26px;line-height:1;
  background:var(--surface);border-radius:14px;
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  transition:all .15s}
.quick-nav-btn:hover{background:var(--bg)}
.quick-nav-btn:active{transform:scale(.94);background:var(--surface-2)}
@media (max-width:480px){
  .quick-nav{grid-template-columns:repeat(3,1fr);gap:8px}
  .quick-nav-btn{font-size:24px;border-radius:12px}
}

/* ===== Flow ===== */
.flow{position:fixed;inset:0;background:var(--bg);z-index:100;
  display:flex;flex-direction:column;overflow-y:auto}
.flow-head{display:flex;align-items:center;gap:12px;padding:14px 18px}
.flow-back{width:38px;height:38px;display:grid;place-items:center;font-size:18px;
  border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.flow-back:active{background:var(--bg)}
.flow-title{font-weight:500;font-size:15px;letter-spacing:.01em}
.amount-display{text-align:center;padding:32px 20px 20px;
  font-family:var(--serif);font-size:clamp(44px,12vw,60px);font-weight:400;
  letter-spacing:-.04em;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:0 18px;max-width:340px;margin:0 auto;width:100%}
.numpad button{height:56px;border-radius:12px;background:var(--surface);font-size:22px;
  font-weight:400;font-family:var(--serif);color:var(--text);
  border:1px solid var(--line);display:grid;place-items:center;transition:background .15s}
.numpad button:active{background:var(--bg);transform:scale(.97)}
.flow-next{margin:20px auto 28px;max-width:340px;width:calc(100% - 36px);height:48px;
  border-radius:12px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;
  letter-spacing:.02em;transition:opacity .2s}
.flow-next:disabled{opacity:.3;cursor:not-allowed}

.cat-amount{text-align:center;padding:24px 20px 4px;
  font-family:var(--serif);font-size:30px;font-weight:400;
  letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums}
.cat-account{text-align:center;font-size:11px;color:var(--muted);
  padding:0 20px 24px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:0 18px 24px;max-width:480px;margin:0 auto;width:100%}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 8px;background:var(--surface);border-radius:12px;
  border:1px solid var(--line);transition:background .15s}
.cat-tile:active{background:var(--bg)}
.cat-icon{font-size:22px;line-height:1}
.cat-name{font-size:11px;font-weight:500;text-align:center;letter-spacing:.01em}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;padding:10px 20px;border-radius:10px;
  font-size:13px;font-weight:500;z-index:200;box-shadow:0 12px 32px rgba(31,47,38,.24);
  animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}

.simple-table{width:100%;border-collapse:collapse}
.simple-table th{text-align:left;font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.14em;padding:6px 0 10px;
  border-bottom:1px solid var(--line-2)}
.simple-table th.right,.simple-table td.right{text-align:right}
.simple-table td{padding:10px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--text)}
.simple-table td.amount-col{text-align:right;width:120px;
  font-family:var(--serif);font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;padding-left:12px}
.simple-table .group-row td{font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.14em;padding-top:18px;padding-bottom:6px;
  border-bottom:1px solid var(--line-2)}
.simple-table tr.total-row td{font-size:16px;font-weight:400;font-family:var(--serif);
  letter-spacing:-.01em;padding-top:16px;border-bottom:none;color:var(--text)}
.simple-table tr.total-row td:first-child{font-family:-apple-system,system-ui,sans-serif;
  font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);
  font-weight:600;vertical-align:middle}
.simple-table tr.total-row td.amount-col{font-size:20px;font-weight:500;letter-spacing:-.02em}
.clickable-val{cursor:pointer;padding:4px 6px;border-radius:6px;
  display:inline-block;min-width:50px;transition:background .15s;font-variant-numeric:tabular-nums}
.clickable-val:hover{background:var(--bg)}
.clickable-val:active{background:var(--surface-2)}
.add-row-btn{display:block;width:100%;padding:12px;text-align:center;
  font-size:11px;font-weight:600;color:var(--text);margin-top:14px;
  background:transparent;border-radius:10px;border:1px dashed var(--line-2);
  letter-spacing:.1em;text-transform:uppercase;transition:all .15s}
.add-row-btn:hover{background:var(--surface);border-color:var(--text)}

/* ===== Календарь ===== */
.calendar-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.calendar-nav button{font-size:18px;font-weight:400;padding:6px 12px;color:var(--text);
  border-radius:6px;transition:background .15s}
.calendar-nav button:hover{background:var(--surface)}
#calTitle{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:-.01em;margin:0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calendar-day-name{text-align:center;font-size:9px;font-weight:600;color:var(--muted);
  letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.calendar-cell{aspect-ratio:1;background:transparent;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:400;position:relative;cursor:pointer;
  border:1px solid var(--line-2);transition:all .15s;color:var(--text)}
.calendar-cell.empty{border-color:transparent;cursor:default}
.calendar-cell.today{border-color:var(--text);font-weight:500}
.calendar-cell:not(.empty):hover{background:var(--surface)}
.calendar-cell:not(.empty):active{background:var(--surface-2)}
.calendar-dots{display:flex;gap:2px;margin-top:2px}
.calendar-dots .dot{width:3px;height:3px;border-radius:50%}
.calendar-dots .dot.income{background:var(--income)}
.calendar-dots .dot.expense{background:var(--expense)}
.calendar-dots .dot.event{background:var(--accent)}

.calendar-modal{position:fixed;inset:0;background:rgba(22,24,29,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:150;display:flex;align-items:center;justify-content:center;
  padding:16px;animation:fadeIn .2s}
.calendar-modal-content{background:var(--surface);border-radius:20px;padding:24px;
  width:100%;max-width:400px;max-height:90vh;overflow-y:auto;
  box-shadow:0 32px 80px rgba(22,24,29,.24)}
.calendar-modal-content h3{margin:0 0 16px;font-size:20px;
  font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.calendar-modal-content input{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;margin-bottom:10px;font-size:14px;background:var(--bg);
  color:var(--text);transition:border-color .15s}
.calendar-modal-content input:focus{border-color:var(--text);background:var(--surface)}
.cal-choice-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;
  border-radius:12px;background:var(--bg);font-weight:500;font-size:14px;
  margin-bottom:8px;text-align:left;transition:background .15s;border:1px solid transparent}
.cal-choice-btn:hover{background:var(--surface-2)}
.cal-choice-btn .icon{font-size:18px}
.cal-type-btn{flex:1;padding:20px 12px;border-radius:12px;color:#fff;
  font-weight:500;font-size:15px;letter-spacing:.02em;font-family:var(--serif)}
.cal-type-btn.income{background:var(--income)}
.cal-type-btn.expense{background:var(--expense)}
.cal-op-list{margin-bottom:12px}
.cal-op-item{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:13px;align-items:center;gap:8px}
.cal-back-btn{width:100%;padding:10px;border-radius:10px;background:var(--bg);
  font-weight:500;font-size:13px;margin-top:6px;letter-spacing:.02em}
.cal-del-btn{width:100%;padding:8px;color:var(--expense);font-weight:500;
  background:none;border:none;margin-top:6px;font-size:12px;letter-spacing:.02em}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.btn-secondary{display:block;width:100%;padding:14px;border-radius:12px;
  background:var(--surface);font-weight:500;font-size:14px;margin-top:10px;
  box-shadow:var(--shadow-sm);text-align:center;border:1px solid var(--line);
  transition:background .15s;letter-spacing:.01em}
.btn-secondary:hover{background:var(--bg)}
.btn-secondary.danger{color:var(--expense)}

.op-row{display:flex;align-items:center;gap:12px;background:var(--surface);
  padding:12px 16px;border-radius:12px;margin-bottom:8px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.op-icon{width:38px;height:38px;display:grid;place-items:center;font-size:18px;
  background:var(--bg);border-radius:10px;flex-shrink:0}
.op-info{flex:1;min-width:0}
.op-cat{font-weight:500;font-size:14px;letter-spacing:.01em}
.op-meta{font-size:11px;color:var(--muted);margin-top:2px}
.op-amount{font-weight:500;font-size:15px;flex-shrink:0;font-family:var(--serif);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op-amount.pos{color:var(--income)}
.op-amount.neg{color:var(--expense)}
.op-del{width:30px;height:30px;border-radius:50%;background:transparent;color:var(--muted);
  font-weight:400;font-size:16px;display:grid;place-items:center;flex-shrink:0;
  transition:all .15s;border:1px solid var(--line);line-height:1}
.op-del:hover{background:var(--expense);color:#fff;border-color:var(--expense)}
.empty{text-align:center;padding:32px 16px;color:var(--muted);background:transparent;
  border-radius:12px;font-size:13px;letter-spacing:.02em;border:1px dashed var(--line)}

.tabs{display:flex;overflow-x:auto;gap:6px;margin-bottom:16px;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 16px;border-radius:999px;background:transparent;font-weight:500;
  font-size:12px;white-space:nowrap;color:var(--muted);border:1px solid var(--line);
  flex-shrink:0;letter-spacing:.02em;transition:all .15s}
.tab-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

.stat-big{background:var(--surface);padding:24px 20px;border-radius:16px;
  margin-bottom:10px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.stat-big .label{font-size:10px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.16em;margin-bottom:10px;font-weight:600}
.stat-big .value{font-family:var(--serif);font-size:clamp(26px,6vw,34px);
  font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-big .value.pos{color:var(--text)}
.stat-big .value.neg{color:var(--expense)}
.stat-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat-mini{background:var(--surface);padding:14px 16px;border-radius:12px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.stat-mini .label{font-size:9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.14em;margin-bottom:6px;font-weight:600}
.stat-mini .value{font-family:var(--serif);font-size:17px;font-weight:400;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-mini .value.pos{color:var(--income)}
.stat-mini .value.neg{color:var(--expense)}

.section-title{font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.16em;margin:16px 0 10px}
.bar-widget{margin-bottom:12px}
.bar-widget .bar-head{display:flex;justify-content:space-between;margin-bottom:6px;
  font-size:13px;align-items:baseline;gap:8px}
.bar-widget .bar-head .name{font-weight:500;font-size:13px}
.bar-widget .bar-head .num{font-size:12px;color:var(--muted);text-align:right;
  font-family:var(--serif);font-variant-numeric:tabular-nums}
.bar-widget .bar-head .num strong{color:var(--text);font-size:14px;font-weight:500}
.bar-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--text);border-radius:2px;
  transition:width .5s cubic-bezier(.16,1,.3,1)}
.bar-fill.income{background:var(--income)}
.bar-fill.expense{background:var(--expense)}
.bar-fill.plan{background:var(--line-2)}
.bar-fact{position:absolute;top:0;height:100%;background:var(--text);
  border-radius:2px;opacity:.9;transition:width .5s cubic-bezier(.16,1,.3,1)}
.small-note{font-size:11px;color:var(--muted);text-align:center;
  margin-top:14px;letter-spacing:.01em}

.switch{display:inline-flex;background:var(--surface);border-radius:999px;
  padding:3px;border:1px solid var(--line)}
.switch button{padding:7px 16px;border-radius:999px;font-weight:500;font-size:12px;
  letter-spacing:.02em;color:var(--muted);transition:all .15s;border:0;background:transparent}
.switch button.active{background:var(--text);color:#fff}
.switch button:hover:not(.active){color:var(--text)}

.journal-card{background:transparent;border-radius:0;padding:0;box-shadow:none;border:none}
.journal-title{margin:0;font-size:22px;font-weight:400;
  font-family:var(--serif);letter-spacing:-.02em}
.journal-sub{margin:4px 0 16px;font-size:13px;color:var(--muted);letter-spacing:.01em}
.journal-toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.journal-toolbar input,.journal-toolbar select{flex:1;min-width:120px;
  padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:13px;background:var(--surface);color:var(--text);transition:border-color .15s}
.journal-toolbar input:focus,.journal-toolbar select:focus{border-color:var(--text)}
.journal-table-wrap{overflow-x:auto;background:var(--surface);border-radius:14px;
  padding:4px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--line)}
.j-table{width:100%;border-collapse:collapse;white-space:nowrap}
.j-table th{text-align:left;padding:12px 6px 10px;font-size:9px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.14em;
  border-bottom:1px solid var(--line)}
.j-table td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.j-table tr:last-child td{border-bottom:none}
.j-date{font-size:13px;font-weight:400;color:var(--text-2);font-variant-numeric:tabular-nums}
.j-acc{font-size:12px;color:var(--muted)}
.j-amount{font-weight:500;font-size:14px;font-family:var(--serif);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.j-amount.pos{color:var(--income)}
.j-amount.neg{color:var(--expense)}
.j-actions{display:flex;gap:6px}
.j-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  background:transparent;font-size:11px;font-weight:500;color:var(--text);
  transition:all .15s;letter-spacing:.02em}
.j-btn:hover{background:var(--bg)}
.j-btn.del{padding:6px 9px;color:var(--muted)}
.j-btn.del:hover{background:var(--expense);color:#fff;border-color:var(--expense)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:9px;
  font-weight:600;margin-bottom:4px;letter-spacing:.1em;text-transform:uppercase}
.pill.income{background:rgba(74,107,82,.08);color:var(--income)}
.pill.expense{background:rgba(161,85,61,.08);color:var(--expense)}

.form-card{background:var(--surface);padding:16px;border-radius:14px;
  margin-top:12px;border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.form-card input{width:100%;border:1px solid var(--line);padding:10px 14px;
  border-radius:10px;margin-bottom:10px;font-size:14px;background:var(--bg);
  color:var(--text);transition:border-color .15s}
.form-card input:focus{border-color:var(--text);background:var(--surface)}

.cat-account{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;text-transform:none;letter-spacing:0}
.acc-chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;color:var(--text-2)}
.acc-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

.home-btn{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;
  border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1}
.home-btn:active{background:var(--surface-2)}
header{position:sticky}
.jf-row{display:flex;gap:8px;align-items:center;width:100%}
.jf-row label{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;min-width:48px}
.jf-row input{min-width:0}
.j-reset{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;color:var(--text-2)}
.j-summary{font-size:12px;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.cat-tools{display:flex;justify-content:center;margin:-8px 0 14px}
.cat-edit-toggle{padding:6px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;color:var(--text-2)}
.cat-tile{position:relative}
.cat-tile.add{border-style:dashed;color:var(--muted)}
.cat-tile .cat-del{position:absolute;top:6px;right:8px;font-size:14px;color:var(--expense);font-weight:600}

.dlg-overlay{position:fixed;inset:0;z-index:300;background:rgba(22,24,29,.5);display:flex;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dlg-box{width:100%;max-width:360px;background:var(--surface);border-radius:16px;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
.dlg-box h3{margin:0 0 12px;font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:-.01em}
.dlg-box p{margin:0 0 14px;color:var(--text-2);font-size:14px;line-height:1.45;white-space:pre-line}
.dlg-box label{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:10px 0 6px}
.dlg-box input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;font-size:16px;background:var(--bg)}
.dlg-box input:focus{border-color:var(--text)}
.dlg-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dlg-presets button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.dlg-actions{display:flex;gap:10px;margin-top:18px}
.dlg-actions button{flex:1;height:44px;border-radius:12px;font-size:14px;font-weight:500;border:1px solid var(--line-2);background:var(--surface)}
.dlg-actions button.ok{background:var(--accent);border-color:var(--accent);color:#fff}

.quick-nav{grid-template-columns:repeat(4,1fr);margin:24px auto 8px}

.form-card select{width:100%;border:1px solid var(--line);padding:10px 14px;border-radius:10px;margin-bottom:10px;font-size:14px;background:var(--bg);color:var(--text)}
.simple-table .add-row-btn{margin:6px 0}

.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.chart-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px}
.ch-svg{display:block;width:100%;height:auto;overflow:visible}
.ch-donut{max-width:210px;margin:0 auto}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-grid.zero{stroke:var(--line-2)}
.ch-axis{fill:var(--muted);font-size:9px}
.ch-val{fill:var(--text-2);font-size:9px;font-weight:600}
.ch-center{font-family:var(--serif);font-size:24px;fill:var(--text)}
.ch-sub{font-size:9px;fill:var(--muted);letter-spacing:.1em}
.ch-legend{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.ch-leg{display:flex;align-items:center;gap:8px;font-size:12px}
.ch-dot{width:10px;height:10px;border-radius:3px;flex:none}
.ch-leg-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-leg-val{color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ch-series{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:11px;color:var(--text-2)}
.ch-series span{display:inline-flex;align-items:center;gap:6px}
.ch-empty{padding:22px 0;text-align:center;color:var(--muted);font-size:13px}

.toast{pointer-events:auto}
#calSummary{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:-4px 0 14px;font-variant-numeric:tabular-nums}
#calSummary b{font-weight:600}
#backupNote{margin:0 0 14px;padding:10px 14px;border:1px dashed var(--line-2);border-radius:12px;font-size:12px;color:var(--text-2);text-align:center;cursor:pointer}

@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#131512;--surface:#1c1f1c;--surface-2:#2a2e2a;--text:#ecebe6;--text-2:#b9b8b0;--muted:#868a83;--line:#2c302c;--line-2:#3b403b;--accent:#4d7a5e;--income:#7fb08f;--expense:#dc8a6d;--shadow-sm:none;--shadow:0 12px 40px rgba(0,0,0,.5)}
  header{background:rgba(19,21,18,.88)!important}
}

.brand-icon{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1}
.quick-nav-btn{color:var(--text-2);font-size:0}
.quick-nav-btn svg{width:26px;height:26px}
.quick-nav-btn:active{color:var(--text)}
.op-icon svg{width:20px;height:20px;color:var(--text-2)}
</style>
</head>
<body>

<header>
  <div class="brand" id="brandBtn" role="button" tabindex="0" aria-label="Календарь" style="cursor:pointer"><span class="brand-icon">F</span><span>Finance</span></div>

<main class="view hidden" id="view-budget">

<main class="view hidden" id="view-analytics">

  <div class="tabs" id="analyticsTabs">

</main>

<main class="view hidden" id="view-calendar">
  <div class="view-head">
    <h2>Календарь</h2>
    <div class="switch" id="calendarSwitch">
      <button data-period="month" class="active">Месяц</button>
      <button data-period="year">Год</button>
    </div>
  </div>
  <div class="calendar-nav">
    <button id="calPrev">‹</button>
    <h3 id="calTitle">Октябрь 2026</h3>
    <button id="calNext">›</button>
  </div>
  <div id="calSummary"></div>
  <div id="backupNote" class="hidden"></div>
  <div id="calMonthView">
    <div class="calendar-grid" style="margin-bottom:6px">
      <div class="calendar-day-name">Пн</div><div class="calendar-day-name">Вт</div>
      <div class="calendar-day-name">Ср</div><div class="calendar-day-name">Чт</div>
      <div class="calendar-day-name">Пт</div><div class="calendar-day-name">Сб</div>
      <div class="calendar-day-name">Вс</div>
    </div>
    <div class="calendar-grid" id="calDays"></div>
  </div>
  <div id="calYearView" class="hidden" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"></div>
  <nav class="quick-nav" aria-label="Разделы">
    <button class="quick-nav-btn" data-view="investments" aria-label="Инвестиции" title="Инвестиции"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></button>
    <button class="quick-nav-btn" data-view="debts" aria-label="Обязательства" title="Обязательства"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></svg></button>
    <button class="quick-nav-btn" data-view="accounts" aria-label="Счета" title="Счета"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/></svg></button>
    <button class="quick-nav-btn" data-view="journal" aria-label="Операции" title="Операции"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>
    <button class="quick-nav-btn" data-view="balance" aria-label="Баланс" title="Баланс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M6 20h12M5 7h14"/><path d="M5 7l-2.5 6a2.5 2.5 0 0 0 5 0zM19 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/></svg></button>
    <button class="quick-nav-btn" data-view="budget" aria-label="Бюджет" title="Бюджет"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15.5 3.5A9 9 0 0 1 20.5 8.5h-5z"/></svg></button>
    <button class="quick-nav-btn" data-view="analytics" aria-label="Аналитика" title="Аналитика"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg></button>
    <button class="quick-nav-btn" data-view="settings" aria-label="Настройки" title="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </nav>
</main>

<main class="view hidden" id="view-journal">
  <div class="journal-card">
    <h2 class="journal-title">Журнал операций</h2>
    <p class="journal-sub">Поиск и фильтрация записей</p>

      <select id="jType">

<main class="view hidden" id="view-investments">

<main class="view hidden" id="view-accounts">

    <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>

<div class="flow hidden" id="flowCategory">
  <div class="flow-head">
    <button class="flow-back" id="catBack">←</button>
    <div class="flow-title">Категория</div>
  </div>
  <div class="cat-amount" id="catAmount">0 ₽</div>
  <div class="cat-account" id="catAccount"></div>
  <div class="cat-tools"><button class="cat-edit-toggle" id="catEditToggle" type="button">Изменить статьи</button></div>

<div class="calendar-modal hidden" id="calModal">
  <div class="calendar-modal-content" id="calModalContent"></div>

<div class="toast hidden" id="toast"></div>

<script>
(() => {
  const KEY = 'moyKapital.v1';
  const VERSION = 8;
  const $ = id => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const fmt = num => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2}).format(round2(num));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function uiDialog({title, message, fields = [], okText = 'Ок', showCancel = true}) {
    return new Promise(resolve => {
      const ov = document.createElement('div'); ov.className = 'dlg-overlay';
      const box = document.createElement('div'); box.className = 'dlg-box'; ov.appendChild(box);
      if (title) { const h = document.createElement('h3'); h.textContent = title; box.appendChild(h); }
      if (message) { const p = document.createElement('p'); p.textContent = message; box.appendChild(p); }
      const inputs = fields.map(f => {
        if (f.label) { const l = document.createElement('label'); l.textContent = f.label; box.appendChild(l); }
        const inp = document.createElement('input'); inp.type = 'text'; inp.value = f.value || ''; inp.placeholder = f.placeholder || ''; if (f.inputmode) inp.setAttribute('inputmode', f.inputmode);
        box.appendChild(inp);
        if (f.presets) {
          const pr = document.createElement('div'); pr.className = 'dlg-presets';
          f.presets.forEach(e => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.onclick = () => { inp.value = e; }; pr.appendChild(b); });
          box.appendChild(pr);
        }
        return inp;
      });
      const row = document.createElement('div'); row.className = 'dlg-actions'; box.appendChild(row);
      const close = v => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
      if (showCancel) { const c = document.createElement('button'); c.type = 'button'; c.textContent = 'Отмена'; c.onclick = () => close(null); row.appendChild(c); }
      const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'ok'; ok.textContent = okText;
      const submit = () => close(fields.length ? inputs.map(i => i.value) : true);
      ok.onclick = submit; row.appendChild(ok);
      const onKey = e => {
        if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); submit(); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(showCancel ? null : true); }
      };
      document.addEventListener('keydown', onKey, true);
      ov.addEventListener('click', e => { if (e.target === ov) close(showCancel ? null : true); });
      document.body.appendChild(ov);
      setTimeout(() => (inputs[0] || ok).focus(), 30);
    });
  }
  const uiPrompt = async (title, value = '') => { const r = await uiDialog({title, fields: [{value}]}); return r ? r[0].trim() : null; };
  const uiConfirm = async (message, okText = 'Удалить') => !!(await uiDialog({message, okText}));
  const uiAlert = message => uiDialog({message, showCancel: false});
  const EMOJI = ['🛒','🍔','☕','🚕','🏠','💡','📱','👕','💊','🎬','✈️','🎁','📚','🐶','💼','💰','📦'];

  const SVGW = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ICONS = {up: SVGW('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'), bank: SVGW('<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>')};
  const initial = () => ({
    version: VERSION,
    accounts: [{id: uid(), name: 'Наличные', opening: 0}],
    operations: [],
    balance: {realty: [], cash: [], invest: [], short: [], long: []},
    budget: { income: [], expense: [] },
    calendarEvents: {},
    categories: {
      expense: [{id:'food', name:'Продукты', icon:'🛒'}, {id:'transport', name:'Транспорт', icon:'🚕'}, {id:'home', name:'Жильё', icon:'🏠'}, {id:'other', name:'Прочее', icon:'📦'}],
      income: [{id:'salary', name:'Зарплата', icon:'💼'}, {id:'other', name:'Прочее', icon:'🎁'}]
    }
  });

  function migrate(s) {
    if (!s) return initial();
    if (!s.calendarEvents) s.calendarEvents = {};
    if (!s.categories) s.categories = initial().categories;
    if (!s.accounts) s.accounts = initial().accounts;
    if (!s.budget) s.budget = initial().budget;
    if (!s.operations) s.operations = [];
    if ((s.version || 0) < 7) {
      s.operations = s.operations.map(o => ({...o, amount: round2((o.amount || 0) / 100)}));
    }
    if (!s.balance) {
      const keep = a => (a || []).map(m => ({id: m.id || uid(), name: m.name, amount: round2(m.amount || 0)}));
      const cash = [];
      s.accounts.forEach(a => {
        let n = a.opening || 0;
        s.operations.forEach(o => { if (o.accountId === a.id) n += o.type === 'income' ? o.amount : -o.amount; });
        n = round2(n);
        if (n) cash.push({id: uid(), name: a.name, amount: n});
      });
      s.balance = {realty: keep(s.manualAssets), cash, invest: keep(s.investments), short: keep(s.debts), long: keep(s.manualPassives)};
    }
    ['realty', 'cash', 'invest', 'short', 'long'].forEach(k => { if (!s.balance[k]) s.balance[k] = []; });
    delete s.manualAssets; delete s.manualPassives; delete s.investments; delete s.debts;
    s.version = VERSION;
    return s;
  }

  function load() {

      const i = s.findIndex(x => x.m === m); if (i >= 0) s[i] = row; else s.push(row);
    } catch (e) {}
  }
  const save = () => { updateSnapshot(); localStorage.setItem(KEY, JSON.stringify(state)); renderAll(); };

  const accountBalance = id => {
    const acc = state.accounts.find(a => a.id === id);
    if (!acc) return 0;
    let n = acc.opening || 0;
    for (const o of state.operations) {
      if (o.type === 'income' && o.accountId === id) n += o.amount;
      if (o.type === 'expense' && o.accountId === id) n -= o.amount;
    }

  };

  const BAL = {
    realty: {title: 'Недвижимость', add: '+ Добавить недвижимость', ph: 'Название (например, Квартира)'},
    cash:   {title: 'Денежные средства', add: '+ Добавить денежные средства', ph: 'Название (например, Карта, Наличные)'},
    invest: {title: 'Инвестиции', add: '+ Добавить инвестицию', ph: 'Название (например, ETF)'},
    short:  {title: 'Краткосрочные обязательства', add: '+ Добавить краткосрочное обязательство', ph: 'Название (например, Кредитная карта)'},
    long:   {title: 'Долгосрочные обязательства', add: '+ Добавить долгосрочное обязательство', ph: 'Название (например, Ипотека)'}
  };
  const sumList = a => round2((a || []).reduce((s, x) => s + (x.amount || 0), 0));
  const parseAmount = s => Math.max(0, round2(parseFloat(String(s || '').replace(/\s/g, '').replace(',', '.')) || 0));
  function balTotals() {
    const b = state.balance;
    const assets = round2(sumList(b.realty) + sumList(b.cash) + sumList(b.invest));
    const passives = round2(sumList(b.short) + sumList(b.long));

  }

  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => showView(b.dataset.view));
  $('brandBtn').onclick = () => showView('calendar');
  $('brandBtn').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showView('calendar'); } };

  function balSection(key, num) {

    let h = `<tr class="group-row"><td>${num}. ${cfg.title}</td><td class="amount-col">${items.length ? fmt(sumList(items)) : ''}</td></tr>`;
    items.forEach(m => {

    });

  function renderBalance() {
    const T = balTotals();
    $('balanceAssetsTable').innerHTML = `<thead><tr><th>Актив</th><th class="right">Сумма</th></tr></thead><tbody>` +

      `<tr class="total-row"><td>4. Итого актив</td><td class="amount-col">${fmt(T.assets)}</td></tr></tbody>`;

      balSection('short', 1) + balSection('long', 2) +

  window.addBal = async kind => {
    const cfg = BAL[kind];
    const r = await uiDialog({title: cfg.add.replace('+ ', ''), fields: [{label: 'Название', value: '', placeholder: cfg.ph}, {label: 'Сумма, ₽', value: '', placeholder: '0', inputmode: 'decimal'}]});
    if (!r) return;

  window.renameBal = async (kind, id) => {

  let undoTimer;
  function withUndo(msg, fn, after) {

  window.delBal = (kind, id) => withUndo('Строка удалена', () => { state.balance[kind] = state.balance[kind].filter(x => x.id !== id); });

  let budgetPeriod = 'month';
  let budgetMonth = todayStr().slice(0, 7);
  const shiftBudget = n => {
    let [y, m] = budgetMonth.split('-').map(Number);
    if (budgetPeriod === 'year') y += n; else { m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } }
    budgetMonth = `${y}-${String(m).padStart(2, '0')}`;
    renderBudget();
  };
  $('budgetPrev').onclick = () => shiftBudget(-1);
  $('budgetNext').onclick = () => shiftBudget(1);
  $('budgetSwitch').onclick = e => {

    });

  function budgetRows(kind, period, ym) {
    const base = ym || budgetMonth, prefix = period === 'year' ? base.slice(0, 4) : base;
    const map = {};
    state.operations.forEach(o => {
      if (o.type !== kind) return;
      if ((o.date || '').slice(0, prefix.length) !== prefix) return;
      const name = o.category || 'Без категории', key = name.toLowerCase().trim();
      if (!map[key]) map[key] = {name, icon: o.categoryIcon || '', amount: 0};
      map[key].amount += o.amount;
    });
    return Object.values(map).map(r => ({...r, amount: round2(r.amount)})).sort((a, b) => b.amount - a.amount);
  }

  function renderBudget() {
    const mult = budgetPeriod === 'year' ? 12 : 1;
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const now = new Date();
    const [by, bm] = budgetMonth.split('-').map(Number);
    const periodLabel = budgetPeriod === 'year' ? `${by} год` : `${monthNames[bm - 1]} ${by}`;
    $('budgetTitle').textContent = periodLabel;
    const renderTable = (kind, tableId, title) => {
      const auto = budgetRows(kind, budgetPeriod), manual = state.budget[kind];
      const numKind = kind === 'income' ? 'budgetIncome' : 'budgetExpense';
      let total = 0;
      let html = `<thead><tr><th>${title} · ${periodLabel}</th><th class="right">Сумма</th></tr></thead><tbody>`;
      auto.forEach(r => {
        total += r.amount;
        html += `<tr><td>${esc((r.icon ? r.icon + ' ' : '') + r.name)}</td><td class="amount-col">${fmt(r.amount)}</td></tr>`;
      });
      manual.forEach(item => {
        const amt = item.amount * mult; total += amt;
        html += `<tr><td><span class="clickable-val" onclick="renameBudgetItem('${kind}','${item.id}')">${esc(item.name)}</span> <button onclick="delBudgetItem('${kind}','${item.id}')" style="color:var(--muted);padding:0 6px;font-weight:400;font-size:14px">×</button></td><td class="amount-col"><span class="clickable-val" onclick="openNumpadFor('${numKind}','${item.id}')">${fmt(amt)}</span></td></tr>`;
      });
      if (!auto.length && !manual.length) html += `<tr><td colspan="2" style="color:var(--muted)">Пока нет данных</td></tr>`;
      total = round2(total);
      html += `<tr class="total-row"><td>Итого</td><td class="amount-col">${fmt(total)}</td></tr></tbody>`;
      $(tableId).innerHTML = html;
      return total;
    };
    const inc = renderTable('income', 'budgetIncomeTable', 'Доход');
    const exp = renderTable('expense', 'budgetExpenseTable', 'Расход');
    const left = round2(inc - exp);
    $('budgetExpenseTable').querySelector('tbody').innerHTML += `<tr class="total-row" style="border-top:1px solid var(--line-2)"><td>Остаток</td><td class="amount-col" style="color:${left < 0 ? 'var(--expense)' : 'var(--text)'}">${fmt(left)}</td></tr>`;
  }
  window.addBudgetItem = async kind => {

    const r = await uiDialog({title: 'Новая статья бюджета', message: 'Чтобы считался факт, назовите статью как категорию: ' + cats, fields: [{value: ''}]});

    if (name) { state.budget[kind].push({id: uid(), name, amount: 0}); save(); }

  window.renameBudgetItem = async (kind, id) => {

  $('addBudgetIncome').onclick = () => addBudgetItem('income');

    $('analyticsTabs').querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x.dataset.tab === analyticsTab));

  function renderAnalytics() {

    if (analyticsTab === 'budget') return renderAnalyticsBudget(body);
