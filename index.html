  function barWidget(label, value, percent, opts = {}) {
    const cls = opts.cls || '';
    const maxPct = Math.min(100, percent);
    const numHtml = opts.num || `<strong>${fmt(value)} ₽</strong>`;
    return `<div class="bar-widget"><div class="bar-head"><span class="name">${esc(label)}</span><span class="num">${numHtml}</span></div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${maxPct}%"></div></div></div>`;
  }

  // ===== Графики (SVG, без внешних библиотек) =====
  const C_INC = '#4a6b52', C_EXP = '#a1553d', C_ACC = '#6f8f7c';
  const CH_COLORS = ['#4a6b52', '#a1553d', '#c9a24a', '#6b7f99', '#8a6f9e', '#b7835a', '#7d9b8a', '#3f5f4d', '#b3a89a'];
  const MON_SHORT = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const chShort = n => {
    const a = Math.abs(n), s = n < 0 ? '−' : '';
    if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + ' млн';
    if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace('.', ',') + ' тыс';
    return s + String(Math.round(a));
  };
  function chScale(min, max, ticks = 4) {
    if (max <= min) max = min + 1;
    const raw = (max - min) / ticks, mag = Math.pow(10, Math.floor(Math.log10(raw))), nn = raw / mag;
    const step = (nn <= 1 ? 1 : nn <= 2 ? 2 : nn <= 5 ? 5 : 10) * mag;
    const lo = Math.floor(min / step + 1e-9) * step, hi = Math.ceil(max / step - 1e-9) * step;
    const vals = [], n = Math.round((hi - lo) / step);
    for (let i = 0; i <= n; i++) vals.push(lo + i * step);
    return {lo, hi, vals};
  }
  const chCard = (title, inner) => `<div class="chart-card"><div class="chart-title">${esc(title)}</div>${inner}</div>`;
  const chEmpty = title => chCard(title, '<div class="ch-empty">Нет данных</div>');
  function chTop(items, n = 8) {
    const s = items.filter(i => i.value > 0).sort((a, b) => b.value - a.value);
    if (s.length <= n) return s;
    return [...s.slice(0, n - 1), {name: 'Прочее', value: round2(s.slice(n - 1).reduce((a, i) => a + i.value, 0))}];
  }

  function donutChart(title, raw) {
    const items = chTop(raw).map((it, i) => ({...it, color: CH_COLORS[i % CH_COLORS.length]}));
    const total = items.reduce((s, i) => s + i.value, 0);
    if (!(total > 0)) return chEmpty(title);
    const R = 70, C = 2 * Math.PI * R;
    let acc = 0;
    let svg = `<svg viewBox="0 0 200 200" class="ch-svg ch-donut" role="img" aria-label="${esc(title)}"><circle cx="100" cy="100" r="${R}" fill="none" style="stroke:var(--surface-2)" stroke-width="26"/>`;
    items.forEach(it => {
      const len = C * it.value / total, gap = items.length > 1 ? Math.min(2, len * 0.2) : 0;
      svg += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${it.color}" stroke-width="26" stroke-dasharray="${(len - gap).toFixed(2)} ${(C - len + gap).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 100 100)"><title>${esc(it.name)}: ${fmt(it.value)} ₽</title></circle>`;
      acc += len;
    });
    svg += `<text x="100" y="99" text-anchor="middle" class="ch-center">${chShort(total)}</text><text x="100" y="117" text-anchor="middle" class="ch-sub">ИТОГО, ₽</text></svg>`;
    const legend = items.map(it => `<div class="ch-leg"><span class="ch-dot" style="background:${it.color}"></span><span class="ch-leg-name">${esc(it.name)}</span><span class="ch-leg-val">${fmt(it.value)} ₽ · ${Math.round(it.value / total * 100)}%</span></div>`).join('');
    return chCard(title, svg + `<div class="ch-legend">${legend}</div>`);
  }

  // groups: [{label, values:[...], colors?:[...]}]; o: {colors, series:[names], showValues, showLabel(i)}
  function columnChart(title, groups, o = {}) {
    const all = groups.flatMap(g => g.values);
    if (!all.some(v => v !== 0)) return chEmpty(title);
    const W = 340, H = 190, L = 42, R = 8, T = 14, B = 26;
    const sc = chScale(Math.min(0, ...all), Math.max(0, ...all));
    const y = v => T + (H - T - B) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
    const gw = (W - L - R) / groups.length, ns = groups[0].values.length;
    const bw = Math.max(2, Math.min(groups.length <= 4 ? 52 : 26, gw * 0.74 / ns));
    let s = `<svg viewBox="0 0 ${W} ${H}" class="ch-svg" role="img" aria-label="${esc(title)}">`;
    sc.vals.forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="ch-grid${Math.abs(v) < 1e-9 ? ' zero' : ''}"/><text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" class="ch-axis">${chShort(v)}</text>`; });
    groups.forEach((g, gi) => {
      const x0 = L + gw * gi + gw / 2 - bw * ns / 2;
      g.values.forEach((v, si) => {
        if (v === 0) return;
        const top = y(Math.max(v, 0)), bot = y(Math.min(v, 0)), col = (g.colors && g.colors[si]) || (o.colors || [])[si] || C_ACC;
        s += `<rect x="${(x0 + si * bw).toFixed(1)}" y="${top.toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" rx="2" fill="${col}"><title>${esc(g.label)}: ${fmt(v)} ₽</title></rect>`;
        if (o.showValues) s += `<text x="${(x0 + si * bw + (bw - 1) / 2).toFixed(1)}" y="${(v >= 0 ? top - 4 : bot + 11).toFixed(1)}" text-anchor="middle" class="ch-val">${chShort(v)}</text>`;
      });
      if (!o.showLabel || o.showLabel(gi)) s += `<text x="${(L + gw * gi + gw / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="ch-axis">${esc(g.label)}</text>`;
    });
    s += '</svg>';
    if (o.series) s += `<div class="ch-series">${o.series.map((n, i) => `<span><i class="ch-dot" style="background:${o.colors[i]}"></i>${esc(n)}</span>`).join('')}</div>`;
    return chCard(title, s);
  }

  // pts: [{label, value}]
  function lineChart(title, pts, o = {}) {
    const vals = pts.map(p => p.value);
    if (!pts.length || !vals.some(v => v !== 0)) return chEmpty(title);
    const W = 340, H = 170, L = 42, R = 14, T = 14, B = 26, col = o.color || C_ACC;
    const sc = chScale(Math.min(0, ...vals), Math.max(0, ...vals));
    const y = v => T + (H - T - B) * (1 - (v - sc.lo) / (sc.hi - sc.lo));
    const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : (W - L - R) * i / (pts.length - 1));
    let s = `<svg viewBox="0 0 ${W} ${H}" class="ch-svg" role="img" aria-label="${esc(title)}">`;
    sc.vals.forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="ch-grid${Math.abs(v) < 1e-9 ? ' zero' : ''}"/><text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" class="ch-axis">${chShort(v)}</text>`; });
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');
    s += `<path d="${path} L${x(pts.length - 1).toFixed(1)} ${y(0).toFixed(1)} L${x(0).toFixed(1)} ${y(0).toFixed(1)} Z" fill="${col}" opacity=".12"/>`;
    s += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { if (pts.length <= 14 || i === pts.length - 1) s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3" fill="${col}"><title>${esc(p.label)}: ${fmt(p.value)} ₽</title></circle>`; });
    const last = pts[pts.length - 1];
    s += `<text x="${Math.min(x(pts.length - 1), W - R - 2).toFixed(1)}" y="${(y(last.value) + (last.value >= 0 ? -8 : 15)).toFixed(1)}" text-anchor="end" class="ch-val">${chShort(last.value)}</text>`;
    pts.forEach((p, i) => { if (!o.showLabel || o.showLabel(i)) s += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="ch-axis">${esc(p.label)}</text>`; });
    s += '</svg>';
    return chCard(title, s);
  }

  function renderAnalyticsBalance(body) {
    const T = balTotals(), b = state.balance;
    const A = [], P = [];
    ['realty', 'cash', 'invest'].forEach(k => A.push({name: BAL[k].title, value: sumList(b[k])}));
    ['short', 'long'].forEach(k => P.push({name: BAL[k].title, value: sumList(b[k])}));
    body.innerHTML = `
      <div class="stat-big"><div class="label">Чистый капитал</div><div class="value ${T.net >= 0 ? 'pos' : 'neg'}">${fmt(T.net)} ₽</div></div>
      <div class="stat-mini-grid">
        <div class="stat-mini"><div class="label">Активы</div><div class="value pos">${fmt(T.assets)} ₽</div></div>
        <div class="stat-mini"><div class="label">Пассивы</div><div class="value neg">${fmt(T.passives)} ₽</div></div>
      </div>` +
      columnChart('Активы, пассивы и капитал', [
        {label: 'Активы', values: [T.assets], colors: [C_INC]},
        {label: 'Пассивы', values: [T.passives], colors: [C_EXP]},
        {label: 'Капитал', values: [T.net], colors: [C_ACC]}
      ], {showValues: true}) +
      lineChart('Динамика капитала по месяцам', (state.snapshots || []).map(s => ({label: MON_SHORT[+s.m.slice(5) - 1] + (s.m.slice(2, 4) !== String(new Date().getFullYear()).slice(2) ? ' ' + s.m.slice(2, 4) : ''), value: s.net})), {color: C_INC}) +
      donutChart('Структура активов', A) +
      donutChart('Структура пассивов', P);
  }

  function renderAnalyticsBudget(body) {
    const incRows = [...budgetRows('income', 'month', todayStr().slice(0, 7)), ...state.budget.income.map(i => ({name: i.name, icon: '', amount: i.amount}))];
    const expRows = [...budgetRows('expense', 'month', todayStr().slice(0, 7)), ...state.budget.expense.map(i => ({name: i.name, icon: '', amount: i.amount}))];
    const incomeTotal = round2(incRows.reduce((s, r) => s + r.amount, 0));
    const expenseTotal = round2(expRows.reduce((s, r) => s + r.amount, 0));
    const leftover = round2(incomeTotal - expenseTotal);
    const usage = incomeTotal > 0 ? Math.round(expenseTotal / incomeTotal * 100) : 0;
    body.innerHTML = `
      <div class="stat-big"><div class="label">Остаток за месяц</div><div class="value ${leftover >= 0 ? 'pos' : 'neg'}">${fmt(leftover)} ₽</div><div class="label" style="margin-top:12px;margin-bottom:0">Израсходовано ${usage}% от дохода</div></div>
      <div class="stat-mini-grid">
        <div class="stat-mini"><div class="label">Доходы</div><div class="value pos">${fmt(incomeTotal)} ₽</div></div>
        <div class="stat-mini"><div class="label">Расходы</div><div class="value neg">${fmt(expenseTotal)} ₽</div></div>
      </div>` +
      columnChart('Доходы, расходы и остаток', [
        {label: 'Доходы', values: [incomeTotal], colors: [C_INC]},
        {label: 'Расходы', values: [expenseTotal], colors: [C_EXP]},
        {label: 'Остаток', values: [leftover], colors: [C_ACC]}
      ], {showValues: true}) +
      donutChart('Расходы по статьям', expRows.map(r => ({name: (r.icon ? r.icon + ' ' : '') + r.name, value: r.amount}))) +
      donutChart('Доходы по статьям', incRows.map(r => ({name: (r.icon ? r.icon + ' ' : '') + r.name, value: r.amount})));
  }

  function renderAnalyticsDebts(body) {
    const sh = state.balance.short, lg = state.balance.long, debts = [...sh, ...lg];
    const total = sumList(debts);
    body.innerHTML = `<div class="stat-big"><div class="label">Всего обязательств</div><div class="value ${total > 0 ? 'neg' : ''}">${fmt(total)} ₽</div><div class="label" style="margin-top:12px;margin-bottom:0">${debts.length} ${pluralDebts(debts.length)}</div></div>` +
      donutChart('Структура обязательств', debts.map(d => ({name: d.name, value: d.amount}))) +
      columnChart('Краткосрочные и долгосрочные', [
        {label: 'Краткосрочные', values: [sumList(sh)], colors: [C_EXP]},
        {label: 'Долгосрочные', values: [sumList(lg)], colors: [C_ACC]}
      ], {showValues: true});
  }
  function pluralDebts(n) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return 'обязательство';
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'обязательства';
    return 'обязательств';
  }

  function renderAnalyticsOps(body) {
    const now = new Date(), y = now.getFullYear(), mo = now.getMonth();
    const monthPrefix = todayStr().slice(0, 7), yearPrefix = String(y);
    const isMonth = opsAnalyticsPeriod === 'month';
    const ops = state.operations.filter(o => isMonth ? (o.date || '').slice(0, 7) === monthPrefix : (o.date || '').slice(0, 4) === yearPrefix);
    const income = round2(ops.filter(o => o.type === 'income').reduce((s, o) => s + o.amount, 0));
    const expense = round2(ops.filter(o => o.type === 'expense').reduce((s, o) => s + o.amount, 0));
    const net = round2(income - expense);
    const periodLabel = isMonth ? 'за месяц' : 'за год';
    const byCat = type => {
      const map = {};
      ops.filter(o => o.type === type).forEach(o => { const k = (o.categoryIcon ? o.categoryIcon + ' ' : '') + (o.category || 'Без категории'); map[k] = (map[k] || 0) + o.amount; });
      return Object.entries(map).map(([name, value]) => ({name, value: round2(value)}));
    };

    // ряды для столбцов и линии
    const n = isMonth ? new Date(y, mo + 1, 0).getDate() : 12;
    const inc = Array(n).fill(0), exp = Array(n).fill(0);
    ops.forEach(o => {
      const i = isMonth ? parseInt((o.date || '').slice(8, 10), 10) - 1 : parseInt((o.date || '').slice(5, 7), 10) - 1;
      if (i >= 0 && i < n) (o.type === 'income' ? inc : exp)[i] += o.amount;
    });
    const label = i => isMonth ? String(i + 1) : MON_SHORT[i];
    const groups = inc.map((v, i) => ({label: label(i), values: [round2(v), round2(exp[i])]}));
    const upTo = isMonth ? now.getDate() : mo + 1;
    const pts = []; let run = 0;
    for (let i = 0; i < upTo; i++) { run += inc[i] - exp[i]; pts.push({label: label(i), value: round2(run)}); }
    const showCol = isMonth ? (i => i === 0 || (i + 1) % 5 === 0) : null;
    const showLine = isMonth ? (i => i === 0 || (i + 1) % 5 === 0) : null;

    body.innerHTML = `
      <div class="switch" id="opsPeriodSwitch" style="margin-bottom:16px">
        <button data-period="month" class="${isMonth ? 'active' : ''}">Месяц</button>
        <button data-period="year" class="${!isMonth ? 'active' : ''}">Год</button>
      </div>
      <div class="stat-big"><div class="label">Разница ${periodLabel}</div><div class="value ${net >= 0 ? 'pos' : 'neg'}">${fmt(net)} ₽</div></div>
      <div class="stat-mini-grid">
        <div class="stat-mini"><div class="label">Доходы</div><div class="value pos">${fmt(income)} ₽</div></div>
        <div class="stat-mini"><div class="label">Расходы</div><div class="value neg">${fmt(expense)} ₽</div></div>
      </div>` +
      columnChart(isMonth ? 'Доходы и расходы по дням' : 'Доходы и расходы по месяцам', groups, {colors: [C_INC, C_EXP], series: ['Доходы', 'Расходы'], showLabel: showCol}) +
      lineChart('Накопленная разница (доходы − расходы)', pts, {color: C_ACC, showLabel: showLine}) +
      donutChart('Расходы по категориям', byCat('expense')) +
      donutChart('Доходы по категориям', byCat('income'));
    $('opsPeriodSwitch').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      opsAnalyticsPeriod = b.dataset.period;
      renderAnalyticsOps(body);
    };
  }

  let calDate = new Date();
  let calView = 'month';
  $('calendarSwitch').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    calView = b.dataset.period;
    $('calendarSwitch').querySelectorAll('button').forEach(x => {
      x.classList.toggle('active', x.dataset.period === calView);
    });
    renderCalendar();
  };
  $('calPrev').onclick = () => { if (calView === 'month') calDate.setMonth(calDate.getMonth() - 1); else calDate.setFullYear(calDate.getFullYear() - 1); renderCalendar(); };
  $('calNext').onclick = () => { if (calView === 'month') calDate.setMonth(calDate.getMonth() + 1); else calDate.setFullYear(calDate.getFullYear() + 1); renderCalendar(); };

  function getDayInfo(dateStr) {
    const ops = state.operations.filter(o => o.date === dateStr);
    const ev = state.calendarEvents[dateStr];
    return {ops, ev, hasIncome: ops.some(o => o.type === 'income'), hasExpense: ops.some(o => o.type === 'expense')};
  }

  function renderCalendar() {
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    $('calTitle').textContent = calView === 'month' ? `${monthNames[month]} ${year}` : `${year} год`;
    const sumPrefix = calView === 'month' ? `${year}-${String(month + 1).padStart(2, '0')}` : String(year);
    let sInc = 0, sExp = 0;
    state.operations.forEach(o => { if ((o.date || '').startsWith(sumPrefix)) { if (o.type === 'income') sInc += o.amount; else sExp += o.amount; } });
    sInc = round2(sInc); sExp = round2(sExp);
    $('calSummary').innerHTML = `<span>Доходы <b style="color:var(--income)">${fmt(sInc)}</b></span><span>Расходы <b style="color:var(--expense)">${fmt(sExp)}</b></span><span>Остаток <b>${fmt(round2(sInc - sExp))}</b></span>`;
    const lb = localStorage.getItem('finance.lastBackup'), nb = $('backupNote');
    const days = lb ? Math.floor((Date.now() - new Date(lb).getTime()) / 864e5) : null;
    const hasData = state.operations.length > 0 || ['realty', 'cash', 'invest', 'short', 'long'].some(k => state.balance[k].length);
    if (hasData && (days === null || days > 30)) { nb.textContent = days === null ? 'Резервной копии ещё не было. Нажмите, чтобы сделать.' : `Последняя копия ${days} дн. назад. Нажмите, чтобы сделать новую.`; nb.classList.remove('hidden'); nb.onclick = () => showView('settings'); }
    else nb.classList.add('hidden');

    if (calView === 'month') {
      $('calMonthView').classList.remove('hidden');
      $('calYearView').classList.add('hidden');
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      let offset = firstDay === 0 ? 6 : firstDay - 1;
      let html = '';
      for (let i = 0; i < offset; i++) html += `<div class="calendar-cell empty"></div>`;
      const today = todayStr();
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const info = getDayInfo(dateStr);
        let dotsHtml = '';
        if (info.hasIncome || info.hasExpense || info.ev) {
          dotsHtml = '<div class="calendar-dots">';
          if (info.hasIncome) dotsHtml += '<div class="dot income"></div>';
          if (info.hasExpense) dotsHtml += '<div class="dot expense"></div>';
          if (info.ev) dotsHtml += '<div class="dot event"></div>';
          dotsHtml += '</div>';
        }
        html += `<div class="calendar-cell ${dateStr === today ? 'today' : ''}" onclick="openCalDay('${dateStr}')"><span>${d}</span>${dotsHtml}</div>`;
      }
      $('calDays').innerHTML = html;
    } else {
      $('calMonthView').classList.add('hidden');
      $('calYearView').classList.remove('hidden');
      let html = '';
      for (let m = 0; m < 12; m++) {
        html += `<div style="text-align:center"><div style="font-weight:500;font-size:13px;margin-bottom:10px;font-family:var(--serif);letter-spacing:-.01em">${monthNames[m]}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
        const firstDay = new Date(year, m, 1).getDay();
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        let offset = firstDay === 0 ? 6 : firstDay - 1;
        for (let i = 0; i < offset; i++) html += `<div></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const info = getDayInfo(dateStr);
          let bg = 'transparent', color = 'var(--muted)', fw = 400, border = 'none';
          if (info.hasIncome) { bg = 'var(--income)'; color = '#fff'; fw = 500; }
          else if (info.hasExpense) { bg = 'var(--expense)'; color = '#fff'; fw = 500; }
          else if (info.ev) { bg = 'var(--accent)'; color = '#fff'; fw = 500; }
          else { border = '1px solid var(--line-2)'; color = 'var(--text)'; }
          html += `<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:5px;background:${bg};color:${color};font-weight:${fw};cursor:pointer;border:${border}" onclick="openCalDay('${dateStr}')">${d}</div>`;
        }
        html += `</div></div>`;
      }
      $('calYearView').innerHTML = html;
    }
  }

  window.openCalDay = dateStr => {
    const info = getDayInfo(dateStr);
    const niceDate = dateStr.split('-').reverse().join('.');
    let html = `<h3>${niceDate}</h3>`;
    if (info.ops.length) {
      html += `<div class="section-title" style="margin-top:0">Операции</div><div class="cal-op-list">`;
      info.ops.forEach(o => {
        const sign = o.type === 'income' ? '+' : '−';
        const color = o.type === 'income' ? 'var(--income)' : 'var(--expense)';
        html += `<div class="cal-op-item"><div>${o.categoryIcon || '📦'} ${esc(o.category)} <button onclick="delOpFromCal('${o.id}','${dateStr}')" style="color:var(--muted);font-weight:400;padding:0 6px">×</button></div><div style="color:${color};font-weight:500;font-family:var(--serif);font-variant-numeric:tabular-nums">${sign}${fmt(o.amount)} ₽</div></div>`;
      });
      html += `</div>`;
    }
    if (info.ev) {
      html += `<div style="padding:14px 18px;background:var(--bg);border-radius:12px;margin-bottom:14px"><div style="font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600">Событие</div><div style="font-weight:500;margin-top:6px">${esc(info.ev.text || '—')}</div>${info.ev.amount ? `<div style="font-weight:500;color:var(--text);font-family:var(--serif);font-size:18px;margin-top:6px;letter-spacing:-.01em">${fmt(info.ev.amount)} ₽</div>` : ''}</div>`;
    }
    html += `<div class="section-title">Добавить на ${niceDate}</div>
      <button class="cal-choice-btn" onclick="calAddOperation('${dateStr}')"><span class="icon">💰</span><span>Операция<br><small style="color:var(--muted);font-weight:400;font-size:12px">Доход или расход с этой датой</small></span></button>
      <button class="cal-choice-btn" onclick="calAddEvent('${dateStr}')"><span class="icon">📅</span><span>Событие<br><small style="color:var(--muted);font-weight:400;font-size:12px">Запланировать платёж или поступление</small></span></button>
      <button class="cal-back-btn" onclick="document.getElementById('calModal').classList.add('hidden')">Закрыть</button>`;
    $('calModalContent').innerHTML = html;
    $('calModal').classList.remove('hidden');
  };

  window.delOpFromCal = (id, dateStr) => withUndo('Операция удалена', () => { state.operations = state.operations.filter(o => o.id !== id); }, () => openCalDay(dateStr));
  window.calAddOperation = dateStr => { $('calModalContent').innerHTML = `<h3>${dateStr.split('-').reverse().join('.')}</h3><div style="display:flex;gap:10px;margin-bottom:14px"><button class="cal-type-btn income" onclick="calStartOpFlow('income','${dateStr}')">Доход</button><button class="cal-type-btn expense" onclick="calStartOpFlow('expense','${dateStr}')">Расход</button></div><button class="cal-back-btn" onclick="openCalDay('${dateStr}')">← Назад</button>`; };
  window.calStartOpFlow = (type, dateStr) => { $('calModal').classList.add('hidden'); editingOpId = null; flow = { type, amountStr: '0', amountRub: 0, target: null, targetDate: dateStr }; $('flowTitle').textContent = (type === 'income' ? 'Доход' : 'Расход') + ' · ' + dateStr.split('-').reverse().join('.'); $('amountNext').textContent = 'Далее'; $('amountDisplay').textContent = '0 ₽'; $('amountNext').disabled = true; $('flowAmount').classList.remove('hidden'); $('flowCategory').classList.add('hidden'); };
  window.calAddEvent = dateStr => {
    const ev = state.calendarEvents[dateStr] || {};
    $('calModalContent').innerHTML = `<h3>Событие на ${dateStr.split('-').reverse().join('.')}</h3><input id="evText" placeholder="Что за событие?" value="${esc(ev.text || '')}"><input id="evAmount" type="number" step="0.01" placeholder="Сумма (необязательно)" value="${ev.amount || ''}"><div style="display:flex;gap:10px;margin-top:10px"><button class="cal-back-btn" style="flex:1;margin-top:0" onclick="openCalDay('${dateStr}')">← Назад</button><button class="cal-back-btn" style="flex:1;margin-top:0;background:var(--accent);color:#fff" onclick="calSaveEvent('${dateStr}')">Сохранить</button></div>${ev.text ? `<button class="cal-del-btn" onclick="calDelEvent('${dateStr}')">Удалить событие</button>` : ''}`;
  };
  window.calSaveEvent = dateStr => { const text = $('evText').value.trim(); const amount = round2(parseFloat($('evAmount').value) || 0); if (text || amount > 0) state.calendarEvents[dateStr] = {text, amount}; else delete state.calendarEvents[dateStr]; save(); openCalDay(dateStr); };
  window.calDelEvent = dateStr => { delete state.calendarEvents[dateStr]; save(); openCalDay(dateStr); };

  function renderJournal() {
    const el = $('journalList');
    const search = ($('jSearch')?.value || '').toLowerCase();
    const type = $('jType')?.value || 'all';
    const month = $('jMonth')?.value || '';

    let ops = [...state.operations].sort((a, b) =>
      (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0)
    );
    if (type !== 'all') ops = ops.filter(o => o.type === type);
    if (month) ops = ops.filter(o => o.date && o.date.startsWith(month));
    const aFrom = parseFloat($('jAmtFrom')?.value), aTo = parseFloat($('jAmtTo')?.value);
    if (!isNaN(aFrom)) ops = ops.filter(o => o.amount >= aFrom);
    if (!isNaN(aTo)) ops = ops.filter(o => o.amount <= aTo);
    const sInc = round2(ops.filter(o => o.type === 'income').reduce((s, o) => s + o.amount, 0));
    const sExp = round2(ops.filter(o => o.type === 'expense').reduce((s, o) => s + o.amount, 0));
    if ($('jSummary')) $('jSummary').textContent = ops.length ? `Найдено: ${ops.length} · доходы ${fmt(sInc)} ₽ · расходы ${fmt(sExp)} ₽` : '';
    if (search) ops = ops.filter(o => (o.category || '').toLowerCase().includes(search) || (o.note || '').toLowerCase().includes(search));

    if (!ops.length) { el.innerHTML = '<div class="empty">Операций не найдено</div>'; return; }

    const rows = ops.map(o => {
      const acc = state.accounts.find(a => a.id === o.accountId);
      const sign = o.type === 'income' ? '+' : '−';
      const cls = o.type === 'income' ? 'pos' : 'neg';
      const pillCls = o.type === 'income' ? 'income' : 'expense';
      const typeName = o.type === 'income' ? 'Доход' : 'Расход';
      const d = (o.date || '').split('-');
      const dateFormatted = d.length === 3 ? `${d[2]}.${d[1]}.${d[0]}` : '—';
      return `<tr>
        <td class="j-date">${dateFormatted}</td>
        <td><span class="pill ${pillCls}">${typeName}</span><br><span style="font-weight:500">${esc(o.category)}</span></td>
        <td class="j-acc">${esc(acc ? acc.name : '—')}</td>
        <td class="j-amount ${cls}">${sign} ${formatAmount(o.amount)} ₽</td>
        <td><div class="j-actions"><button class="j-btn" onclick="editOp('${o.id}')">Изм.</button><button class="j-btn del" onclick="delOp('${o.id}')">×</button></div></td>
      </tr>`;
    }).join('');

    el.innerHTML = `<table class="j-table"><thead><tr><th>Дата</th><th>Операция</th><th>Счёт</th><th>Сумма</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  ['jSearch', 'jType', 'jMonth', 'jAmtFrom', 'jAmtTo'].forEach(id => {
    $(id)?.addEventListener('input', renderJournal);
    $(id)?.addEventListener('change', renderJournal);
  });

  $('jReset').onclick = () => {
    ['jSearch', 'jMonth', 'jAmtFrom', 'jAmtTo'].forEach(id => { $(id).value = ''; });
    $('jType').value = 'all';
    renderJournal();
  };

  window.delOp = id => withUndo('Операция удалена', () => { state.operations = state.operations.filter(x => x.id !== id); });

  let editingOpId = null;
  window.editOp = id => {
    const op = state.operations.find(o => o.id === id);
    if (!op) return;
    editingOpId = id;
    flow = { type: op.type, accountId: op.accountId, amountStr: String(op.amount), amountRub: op.amount, target: null, targetDate: op.date };
    $('flowTitle').textContent = 'Редактировать';
    $('amountNext').textContent = 'Далее';
    updateAmountDisplay();
    $('flowAmount').classList.remove('hidden');
    $('flowCategory').classList.add('hidden');
  };

  function renderInvestments() {
    const el = $('investList'), list = state.balance.invest;
    el.innerHTML = list.length
      ? list.map(i => `<div class="op-row"><div class="op-icon">${ICONS.up}</div><div class="op-info"><div class="op-cat">${esc(i.name)}</div></div><div class="op-amount"><span class="clickable-val" onclick="openNumpadFor('bal','invest:${i.id}')">${fmt(i.amount)}</span> ₽</div><button class="op-del" onclick="delBal('invest','${i.id}')">×</button></div>`).join('')
      : '<div class="empty">Нет активов</div>';
  }
  $('invAdd').onclick = () => { const name = $('invName').value.trim(), amt = parseAmount($('invAmount').value); if (name) { state.balance.invest.push({id: uid(), name, amount: amt}); $('invName').value = ''; $('invAmount').value = ''; save(); } };

  function renderDebts() {
    const el = $('debtList');
    el.innerHTML = ['short', 'long'].map(k => {
      const list = state.balance[k];
      return `<div class="section-title">${BAL[k].title}</div>` + (list.length
        ? list.map(d => `<div class="op-row"><div class="op-icon">${ICONS.bank}</div><div class="op-info"><div class="op-cat">${esc(d.name)}</div></div><div class="op-amount neg"><span class="clickable-val" onclick="openNumpadFor('bal','${k}:${d.id}')">${fmt(d.amount)}</span> ₽</div><button class="op-del" onclick="delBal('${k}','${d.id}')">×</button></div>`).join('')
        : '<div class="empty">Нет</div>');
    }).join('');
  }
  $('debtAdd').onclick = () => { const name = $('debtName').value.trim(), amt = parseAmount($('debtAmount').value), term = $('debtTerm').value; if (name) { state.balance[term].push({id: uid(), name, amount: amt}); $('debtName').value = ''; $('debtAmount').value = ''; save(); } };

  function renderAccounts() {
    const el = $('accountsList');
    el.innerHTML = state.accounts.map(a => `<div class="op-row"><div class="op-info"><div class="op-cat">${esc(a.name)}</div><div class="op-meta">Баланс: ${fmt(accountBalance(a.id))} ₽</div></div><div class="j-actions"><button class="j-btn" onclick="renameAccount('${a.id}')">Изм.</button><button class="j-btn del" onclick="delAccount('${a.id}')">×</button></div></div>`).join('');
  }
  window.renameAccount = async id => {
    const a = state.accounts.find(x => x.id === id); if (!a) return;
    const n = await uiPrompt('Название счёта', a.name);
    if (n) { a.name = n; save(); }
  };
  window.delAccount = async id => {
    if (state.accounts.length <= 1) { await uiAlert('Нужен хотя бы один счёт.'); return; }
    const n = state.operations.filter(o => o.accountId === id).length;
    if (!(await uiConfirm(n ? `Вместе со счётом будут удалены операции: ${n}. Продолжить?` : 'Удалить счёт?'))) return;
    state.operations = state.operations.filter(o => o.accountId !== id);
    state.accounts = state.accounts.filter(a => a.id !== id);
    save();
  };
  $('btnAddAccount').onclick = async () => { const name = await uiPrompt('Название счёта'); if (name) { state.accounts.push({id: uid(), name, opening: 0}); save(); } };

  function renderCategories() {
    const el = $('catEditor'); if (!el) return;
    el.innerHTML = ['expense', 'income'].map(t => {
      const cats = state.categories[t] || [];
      return `<div class="section-title">Категории: ${t === 'expense' ? 'расходы' : 'доходы'}</div>` +
        cats.map(c => `<div class="op-row"><div class="op-icon">${esc(c.icon)}</div><div class="op-info"><div class="op-cat">${esc(c.name)}</div></div><div class="j-actions"><button class="j-btn" onclick="editCat('${t}','${c.id}')">Изм.</button><button class="j-btn del" onclick="delCat('${t}','${c.id}')">×</button></div></div>`).join('') +
        `<button class="add-row-btn" onclick="addCat('${t}')">+ Добавить категорию</button>`;
    }).join('');
  }
  window.addCat = async t => {
    const r = await uiDialog({title: t === 'expense' ? 'Новая статья расходов' : 'Новая статья доходов', fields: [{label: 'Название', value: ''}, {label: 'Эмодзи', value: '📦', presets: EMOJI}]});
    if (!r) return;
    const name = r[0].trim(); if (!name) return;
    const icon = r[1].trim() || '📦';
    if ((state.categories[t] || []).some(c => c.name.toLowerCase() === name.toLowerCase())) { await uiAlert('Такая категория уже есть.'); return; }
    state.categories[t].push({id: uid(), name, icon}); save();
  };
  window.editCat = async (t, id) => {
    const c = state.categories[t].find(x => x.id === id); if (!c) return;
    const r = await uiDialog({title: 'Изменить статью', fields: [{label: 'Название', value: c.name}, {label: 'Эмодзи', value: c.icon, presets: EMOJI}]});
    if (!r) return;
    const name = r[0].trim(); if (!name) return;
    const icon = r[1].trim() || c.icon;
    if (state.categories[t].some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())) { await uiAlert('Такая категория уже есть.'); return; }
    const old = c.name;
    state.operations.forEach(o => { if (o.type === t && o.category === old) { o.category = name; o.categoryIcon = icon; } });
    state.budget[t].forEach(b => { if ((b.name || '').toLowerCase().trim() === old.toLowerCase().trim()) b.name = name; });
    c.name = name; c.icon = icon; save();
  };
  window.delCat = async (t, id) => {
    if ((state.categories[t] || []).length <= 1) { await uiAlert('Нужна хотя бы одна категория.'); return; }
    if (!(await uiConfirm('Удалить категорию? Старые операции сохранят её название.'))) return;
    state.categories[t] = state.categories[t].filter(x => x.id !== id); save();
  };

  const pad2 = n => String(n).padStart(2, '0');
  function genRecurring() {
    const rs = state.recurring || [], now = new Date(); let changed = false;
    rs.forEach(r => {
      if (!state.accounts.find(a => a.id === r.accountId)) r.accountId = (state.accounts[0] || {}).id;
      let [y, m] = (r.last || '').split('-').map(Number); if (!y) return;
      for (let g = 0; g < 60; g++) {
        m++; if (m > 12) { m = 1; y++; }
        const cy = now.getFullYear(), cm = now.getMonth() + 1;
        if (y > cy || (y === cy && m > cm)) break;
        const d = Math.min(r.day, new Date(y, m, 0).getDate());
        if (y === cy && m === cm && d > now.getDate()) break;
        state.operations.push({id: uid(), type: r.type, amount: r.amount, date: `${y}-${pad2(m)}-${pad2(d)}`, accountId: r.accountId, category: r.category, categoryIcon: r.icon, recurring: true});
        r.last = `${y}-${pad2(m)}`; changed = true;
      }
    });
    return changed;
  }
  function renderRecurring() {
    const el = $('recEditor'); if (!el) return;
    const rs = state.recurring || [];
    el.innerHTML = '<div class="section-title">Повторяющиеся платежи</div>' + rs.map(r => `<div class="op-row"><div class="op-icon">${esc(r.icon)}</div><div class="op-info"><div class="op-cat">${esc(r.category)}</div><div class="op-meta">${r.day}-го числа · ${r.type === 'income' ? 'доход' : 'расход'} · ${fmt(r.amount)} ₽</div></div><div class="j-actions"><button class="j-btn del" onclick="delRecurring('${r.id}')">×</button></div></div>`).join('') + '<button class="add-row-btn" onclick="addRecurring()">+ Добавить повторяющийся платёж</button>';
  }
  window.delRecurring = id => withUndo('Платёж удалён', () => { state.recurring = (state.recurring || []).filter(r => r.id !== id); });
  window.addRecurring = async () => {
    const r = await uiDialog({title: 'Повторяющийся платёж', fields: [{label: 'Тип: расход или доход', value: 'расход'}, {label: 'Категория', value: '', placeholder: 'Например, Жильё'}, {label: 'Сумма, ₽', value: '', inputmode: 'decimal'}, {label: 'День месяца (1–31)', value: '1', inputmode: 'numeric'}]});
    if (!r) return;
    const type = r[0].trim().toLowerCase().startsWith('д') ? 'income' : 'expense', category = r[1].trim(), amount = parseAmount(r[2]), day = Math.min(31, Math.max(1, parseInt(r[3], 10) || 1));
    if (!category || !amount) { await uiAlert('Нужны категория и сумма.'); return; }
    const c = (state.categories[type] || []).find(x => x.name.toLowerCase() === category.toLowerCase());
    const n = new Date(), pm = new Date(n.getFullYear(), n.getMonth() - 1, 1);
    (state.recurring = state.recurring || []).push({id: uid(), type, category: c ? c.name : category, icon: c ? c.icon : '🔁', amount, day, accountId: (state.accounts[0] || {}).id, last: `${pm.getFullYear()}-${pad2(pm.getMonth() + 1)}`});
    if (genRecurring()) save(); else save();
  };
  $('btnCsv').onclick = () => {
    const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const rows = [['Дата', 'Тип', 'Категория', 'Сумма', 'Счёт', 'Комментарий']];
    [...state.operations].sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(o => rows.push([o.date, o.type === 'income' ? 'Доход' : 'Расход', o.category, String(o.amount).replace('.', ','), (state.accounts.find(a => a.id === o.accountId) || {}).name || '', o.comment || o.note || '']));
    downloadBlob(new Blob(['\ufeff' + rows.map(r => r.map(q).join(';')).join('\n')], {type: 'text/csv;charset=utf-8'}), 'finance-operations-' + todayStr() + '.csv');
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && genRecurring()) save(); });
  const markBackup = () => { try { localStorage.setItem('finance.lastBackup', new Date().toISOString()); } catch (e) {} renderCalendar(); };
  const downloadBlob = (blob, name) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url); };
  $('btnExport').onclick = () => { downloadBlob(new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'}), 'finance-' + todayStr() + '.json'); markBackup(); };
  $('btnShare').onclick = async () => {
    const name = 'finance-' + todayStr() + '.json';
    const file = new File([JSON.stringify(state, null, 2)], name, {type: 'application/json'});
    if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file], title: name}); markBackup(); } catch (e) {} }
    else { downloadBlob(file, name); markBackup(); showToast('Меню «Поделиться» недоступно, файл скачан'); }
  };
  function buildAiReport() {
    const T = balTotals(), b = state.balance, now = new Date(), pad = n => String(n).padStart(2, '0');
    const L = ['Ты опытный финансовый консультант. Ниже мои личные финансовые данные из приложения Finance (суммы в рублях). Оцени: 1) общее состояние и подушку безопасности, 2) где я трачу слишком много, 3) риски (долги, структура активов), 4) дай 5 конкретных шагов. Отвечай по-русски, коротко и по делу.', '', 'Дата: ' + todayStr(), '', 'БАЛАНС'];
    ['realty', 'cash', 'invest', 'short', 'long'].forEach(k => L.push(`${BAL[k].title}: ${fmt(sumList(b[k]))}` + (b[k].length ? ' (' + b[k].map(i => `${i.name} ${fmt(i.amount)}`).join(', ') + ')' : '')));
    L.push(`Итого активы ${fmt(T.assets)}; пассивы ${fmt(T.passives)}; чистый капитал ${fmt(T.net)}`, '', 'ДОХОДЫ И РАСХОДЫ ПО МЕСЯЦАМ (последние 6)');
    const cat = {income: {}, expense: {}};
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1), p = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      let inc = 0, exp = 0;
      state.operations.forEach(o => { if ((o.date || '').startsWith(p)) { if (o.type === 'income') inc += o.amount; else exp += o.amount; if (i < 3) cat[o.type][o.category || 'Без категории'] = (cat[o.type][o.category || 'Без категории'] || 0) + o.amount; } });
      L.push(`${p}: доходы ${fmt(round2(inc))}, расходы ${fmt(round2(exp))}`);
    }
    [['expense', 'РАСХОДЫ ПО КАТЕГОРИЯМ (последние 3 месяца)'], ['income', 'ДОХОДЫ ПО КАТЕГОРИЯМ (последние 3 месяца)']].forEach(([k, h]) => {
      L.push('', h); const e = Object.entries(cat[k]).sort((a, c) => c[1] - a[1]);
      L.push(...(e.length ? e.map(([n, v]) => `${n}: ${fmt(round2(v))}`) : ['нет данных']));
    });
    return L.join('\n');
  }
  $('btnAi').onclick = async () => {
    if (!(await uiConfirm('Отчёт с суммами и названиями ваших статей будет скопирован. Вставьте его в чат с ИИ (например, Claude): данные попадут туда, куда вы их вставите.', 'Скопировать'))) return;
    const text = buildAiReport();
    try { await navigator.clipboard.writeText(text); showToast('Скопировано. Вставьте в чат с ИИ'); }
    catch (e) { downloadBlob(new Blob([text], {type: 'text/plain'}), 'finance-report-' + todayStr() + '.txt'); showToast('Отчёт скачан файлом'); }
  };
  $('btnImport').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const s = JSON.parse(await f.text()); if (!s.accounts || !s.operations) throw new Error('bad'); if (!(await uiConfirm('Импорт заменит текущие данные. Продолжить?', 'Заменить'))) return; state = migrate(s); save(); } catch(err) { uiAlert('Не удалось импортировать файл'); } finally { e.target.value = ''; } };
  $('btnReset').onclick = async () => { if (!(await uiConfirm('Удалить все данные? Это действие необратимо.'))) return; state = initial(); save(); };

  let catEditMode = false;
  function renderCatGrid() {
    const cnt = {}; state.operations.forEach(o => { if (o.type === flow.type) cnt[o.category] = (cnt[o.category] || 0) + 1; });
    const cats = [...(state.categories[flow.type] || [])].sort((a, b) => (cnt[b.name] || 0) - (cnt[a.name] || 0));
    $('catEditToggle').textContent = catEditMode ? 'Готово' : 'Изменить статьи';
    $('catGrid').innerHTML = cats.map(c => `<button class="cat-tile" onclick="catTileClick('${esc(c.id)}')"><span class="cat-icon">${c.icon}</span><span class="cat-name">${esc(c.name)}</span>${catEditMode ? '<span class="cat-del">×</span>' : ''}</button>`).join('') +
      `<button class="cat-tile add" onclick="addCatInFlow()"><span class="cat-icon">＋</span><span class="cat-name">Новая статья</span></button>`;
  }
  window.catTileClick = async id => { if (catEditMode) { await delCat(flow.type, id); renderCatGrid(); } else selectCategory(id); };
  window.addCatInFlow = async () => { await addCat(flow.type); renderCatGrid(); };
  $('catEditToggle').onclick = () => { catEditMode = !catEditMode; renderCatGrid(); };
  let lastAccountId = null;
  function renderCatAccount() {
    if (!state.accounts.find(a => a.id === flow.accountId)) flow.accountId = (state.accounts.find(a => a.id === lastAccountId) || state.accounts[0] || {}).id;
    $('catAccount').innerHTML = state.accounts.length
      ? state.accounts.map(a => `<button class="acc-chip ${a.id === flow.accountId ? 'active' : ''}" onclick="pickCatAccount('${a.id}')">${esc(a.name)}</button>`).join('')
      : 'Нет счёта';
  }
  window.pickCatAccount = id => { flow.accountId = id; renderCatAccount(); };
  let flow = { type: null, accountId: null, amountStr: '0', amountRub: 0, target: null, targetDate: null };
  window.openFlow = type => { editingOpId = null; flow = { type, amountStr: '0', amountRub: 0, target: null, targetDate: null }; $('flowTitle').textContent = type === 'income' ? 'Доход' : 'Расход'; $('amountNext').textContent = 'Далее'; $('amountDisplay').textContent = '0 ₽'; $('amountNext').disabled = true; $('flowAmount').classList.remove('hidden'); $('flowCategory').classList.add('hidden'); };
  window.openNumpadFor = (kind, id) => {
    let currentVal = 0;
    if (kind === 'bal') { const [sec, iid] = id.split(':'); currentVal = (state.balance[sec] || []).find(x => x.id === iid)?.amount || 0; }
    else if (kind === 'budgetIncome') { const item = state.budget.income.find(x => x.id === id); currentVal = item ? item.amount * (budgetPeriod === 'year' ? 12 : 1) : 0; }
    else if (kind === 'budgetExpense') { const item = state.budget.expense.find(x => x.id === id); currentVal = item ? item.amount * (budgetPeriod === 'year' ? 12 : 1) : 0; }
    const valStr = currentVal ? String(round2(currentVal)) : '0';
    editingOpId = null; flow = { type: 'edit', amountStr: valStr, amountRub: round2(currentVal), target: {kind, id}, targetDate: null };
    $('flowTitle').textContent = 'Изменить сумму'; $('amountNext').textContent = 'Сохранить'; updateAmountDisplay();
    $('flowAmount').classList.remove('hidden'); $('flowCategory').classList.add('hidden');
  };

  $('amountBack').onclick = () => { $('flowAmount').classList.add('hidden'); $('flowCategory').classList.add('hidden'); };
  $('numpad').onclick = e => { const btn = e.target.closest('button'); if (btn) handleKey(btn.dataset.key); };

  function handleKey(key) {
    let s = flow.amountStr;
    if (key === 'back') s = s.length > 1 ? s.slice(0, -1) : '0';
    else if (key === ',' || key === '.') { if (!s.includes('.')) s += '.'; }
    else if (key === '0') { if (s === '0') return; if (s.replace('.','').length < 12) s += '0'; }
    else { if (s === '0') s = key; else if (s.replace('.','').length < 12) s += key; }
    if (s.includes('.')) { const [i, f] = s.split('.'); if (f && f.length > 2) s = i + '.' + f.slice(0, 2); }
    flow.amountStr = s; updateAmountDisplay();
  }

  function updateAmountDisplay() {
    $('amountDisplay').textContent = formatAmount(flow.amountStr) + ' ₽';
    flow.amountRub = round2(parseFloat(flow.amountStr || '0'));
    $('amountNext').disabled = !(flow.amountRub > 0) && flow.type !== 'edit';
  }

  function formatAmount(v) {
    if (v === '' || v === null || v === undefined) return '0';
    let s = typeof v === 'string' ? v : String(v);
    if (!s || s === '0') return '0';
    let [i, f] = s.split('.');
    if (!i) i = '0';
    const intFmt = i.replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
    if (f === undefined) return intFmt;
    f = f.replace(/0+$/, '');
    return f ? intFmt + ',' + f : intFmt;
  }

  document.addEventListener('keydown', e => {
    if ($('flowAmount').classList.contains('hidden')) return;
    if (/^[0-9]$/.test(e.key)) { handleKey(e.key); e.preventDefault(); }
    else if (e.key === '.' || e.key === ',') { handleKey(','); e.preventDefault(); }
    else if (e.key === 'Backspace') { handleKey('back'); e.preventDefault(); }
    else if (e.key === 'Enter' && !$('amountNext').disabled) { $('amountNext').click(); e.preventDefault(); }
    else if (e.key === 'Escape') { $('amountBack').click(); }
  });

  $('amountNext').onclick = () => {
    const val = round2(parseFloat(flow.amountStr));
    if (flow.target) {
      const t = flow.target;
      if (t.kind === 'bal') { const [sec, iid] = t.id.split(':'); const item = (state.balance[sec] || []).find(x => x.id === iid); if (item) item.amount = val; }
      else if (t.kind === 'budgetIncome') { const item = state.budget.income.find(x => x.id === t.id); if (item) item.amount = round2(budgetPeriod === 'year' ? val / 12 : val); }
      else if (t.kind === 'budgetExpense') { const item = state.budget.expense.find(x => x.id === t.id); if (item) item.amount = round2(budgetPeriod === 'year' ? val / 12 : val); }
      save(); $('flowAmount').classList.add('hidden');
    } else {
      if (!(flow.amountRub > 0)) return;
      $('catAmount').textContent = formatAmount(flow.amountStr) + ' ₽';
      renderCatAccount();
      catEditMode = false;
      renderCatGrid();
      $('flowAmount').classList.add('hidden'); $('flowCategory').classList.remove('hidden');
    }
  };

  $('catBack').onclick = () => { $('flowCategory').classList.add('hidden'); $('flowAmount').classList.remove('hidden'); };
  window.selectCategory = catId => {
    const cat = (state.categories[flow.type] || []).find(c => c.id === catId);
    if (!cat) return;
    const acc = state.accounts.find(a => a.id === flow.accountId) || state.accounts[0];
    if (!acc) { uiAlert('Нет счёта.'); return; }
    lastAccountId = acc.id;

    if (editingOpId) {
      const existing = state.operations.find(o => o.id === editingOpId);
      if (existing) {
        existing.type = flow.type;
        existing.accountId = acc.id;
        existing.amount = flow.amountRub;
        existing.date = flow.targetDate || existing.date || todayStr();
        existing.category = cat.name;
        existing.categoryIcon = cat.icon;
      }
      editingOpId = null;
      save(); $('flowAmount').classList.add('hidden'); $('flowCategory').classList.add('hidden');
      showView('journal'); showToast(`Обновлено: ${cat.icon} ${cat.name} · ${formatAmount(flow.amountStr)} ₽`);
    } else {
      state.operations.push({ id: uid(), type: flow.type, amount: flow.amountRub, date: flow.targetDate || todayStr(), accountId: acc.id, category: cat.name, categoryIcon: cat.icon, note: '', createdAt: Date.now() });
      $('flowAmount').classList.add('hidden'); $('flowCategory').classList.add('hidden');
      const wasFromCalendar = !!flow.targetDate;
      save();
      if (wasFromCalendar) { showView('calendar'); showToast(`Сохранено на ${flow.targetDate.split('-').reverse().join('.')}: ${cat.icon} ${cat.name} · ${formatAmount(flow.amountStr)} ₽`); }
      else { showView('calendar'); showToast(`Сохранено: ${cat.icon} ${cat.name} · ${formatAmount(flow.amountStr)} ₽`); }
    }
  };

  let toastTimer;
  function showToast(text) { const t = $('toast'); t.textContent = text; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2500); }

  function renderAll() {
    renderBalance();
    renderBudget();
    if (!$('view-analytics').classList.contains('hidden')) renderAnalytics();
    renderCalendar();
    renderJournal();
    renderInvestments();
    renderDebts();
    renderAccounts();
    renderCategories();
    renderRecurring();
  }

  if (genRecurring()) localStorage.setItem(KEY, JSON.stringify(state));
  renderAll();
  showView('calendar');
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
